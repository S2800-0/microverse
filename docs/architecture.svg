<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img"><title>Microverse software architecture</title><desc>Three layers: a browser app that runs the simulation, rigs and guide on the device; a loopback-only local server that holds the API key and spend caps; and the Meta APIs it can call.</desc><style>
text{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;fill:#2b2a26}.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#5b5646}
.frame{fill:#faf6ed;stroke:#9e957e;stroke-width:.5;stroke-dasharray:4 4}.arr{stroke:#5b5646;stroke-width:1.5;fill:none}
.green rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.5}.green .th{fill:#27500A}.green .ts{fill:#3B6D11}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
@media(prefers-color-scheme:dark){text{fill:#e8e4d8}.ts{fill:#b4b2a9}.frame{fill:#2b2a26;stroke:#888780}.arr{stroke:#b4b2a9}
.green rect{fill:#27500A;stroke:#97C459}.green .th{fill:#EAF3DE}.green .ts{fill:#C0DD97}.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .th{fill:#EEEDFE}.purple .ts{fill:#CECBF6}.gray rect{fill:#444441;stroke:#B4B2A9}.gray .th{fill:#F1EFE8}.gray .ts{fill:#D3D1C7}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="650" fill="none"/><rect class="frame" x="40" y="30" width="600" height="262" rx="20"/><text class="th" x="60" y="54">Browser app: static pages, plain JavaScript</text><g class="green"><rect x="60" y="86" width="176" height="60" rx="8"/><text class="th" x="148" y="106" text-anchor="middle" dominant-baseline="central">Forest scene</text><text class="ts" x="148" y="127" text-anchor="middle" dominant-baseline="central">Map, animals, camera</text></g><g class="green"><rect x="252" y="86" width="176" height="60" rx="8"/><text class="th" x="340" y="106" text-anchor="middle" dominant-baseline="central">Investigation</text><text class="ts" x="340" y="127" text-anchor="middle" dominant-baseline="central">Guide, results, notes</text></g><g class="purple"><rect x="444" y="86" width="176" height="60" rx="8"/><text class="th" x="532" y="106" text-anchor="middle" dominant-baseline="central">Creature import</text><text class="ts" x="532" y="127" text-anchor="middle" dominant-baseline="central">Photo, cutout, review</text></g><g class="green"><rect x="60" y="160" width="176" height="60" rx="8"/><text class="th" x="148" y="180" text-anchor="middle" dominant-baseline="central">Model engine</text><text class="ts" x="148" y="201" text-anchor="middle" dominant-baseline="central">Seeded and replayable</text></g><g class="green"><rect x="252" y="160" width="176" height="60" rx="8"/><text class="th" x="340" y="180" text-anchor="middle" dominant-baseline="central">Rig and motion</text><text class="ts" x="340" y="201" text-anchor="middle" dominant-baseline="central">Legs cut from the art</text></g><g class="purple"><rect x="444" y="160" width="176" height="60" rx="8"/><text class="th" x="532" y="180" text-anchor="middle" dominant-baseline="central">Ask the guide</text><text class="ts" x="532" y="201" text-anchor="middle" dominant-baseline="central">Local, Spark optional</text></g><g class="gray"><rect x="60" y="236" width="560" height="40" rx="8"/><text class="ts" x="340" y="256" text-anchor="middle" dominant-baseline="central">Device only: saved creatures, replays, discovery cards, local voice</text></g><line x1="340" y1="294" x2="340" y2="326" class="arr" marker-end="url(#arrow)"/><rect class="frame" x="40" y="328" width="600" height="120" rx="20"/><text class="th" x="60" y="352">Local server: loopback only, holds the API key</text><g class="purple"><rect x="60" y="372" width="128" height="56" rx="8"/><text class="th" x="124" y="392" text-anchor="middle" dominant-baseline="central">Spark service</text><text class="ts" x="124" y="413" text-anchor="middle" dominant-baseline="central">Picks evidence</text></g><g class="purple"><rect x="204" y="372" width="128" height="56" rx="8"/><text class="th" x="268" y="392" text-anchor="middle" dominant-baseline="central">Creature art</text><text class="ts" x="268" y="413" text-anchor="middle" dominant-baseline="central">Paint, cut out</text></g><g class="purple"><rect x="348" y="372" width="128" height="56" rx="8"/><text class="th" x="412" y="392" text-anchor="middle" dominant-baseline="central">Voice, place</text><text class="ts" x="412" y="413" text-anchor="middle" dominant-baseline="central">Dictation, SAM</text></g><g class="gray"><rect x="492" y="372" width="128" height="56" rx="8"/><text class="th" x="556" y="392" text-anchor="middle" dominant-baseline="central">Spend caps</text><text class="ts" x="556" y="413" text-anchor="middle" dominant-baseline="central">Local ledgers</text></g><line x1="340" y1="450" x2="340" y2="482" class="arr" marker-end="url(#arrow)"/><rect class="frame" x="40" y="484" width="600" height="118" rx="20"/><text class="th" x="60" y="508">Meta APIs: every call is explicit and capped</text><g class="purple"><rect x="60" y="528" width="128" height="56" rx="8"/><text class="th" x="124" y="548" text-anchor="middle" dominant-baseline="central">Muse Spark</text><text class="ts" x="124" y="569" text-anchor="middle" dominant-baseline="central">Tool calls</text></g><g class="purple"><rect x="204" y="528" width="128" height="56" rx="8"/><text class="th" x="268" y="548" text-anchor="middle" dominant-baseline="central">Muse Image</text><text class="ts" x="268" y="569" text-anchor="middle" dominant-baseline="central">Repaints pets</text></g><g class="purple"><rect x="348" y="528" width="128" height="56" rx="8"/><text class="th" x="412" y="548" text-anchor="middle" dominant-baseline="central">SAM 3.1</text><text class="ts" x="412" y="569" text-anchor="middle" dominant-baseline="central">Cutouts</text></g><g class="purple"><rect x="492" y="528" width="128" height="56" rx="8"/><text class="th" x="556" y="548" text-anchor="middle" dominant-baseline="central">Speech-to-text</text><text class="ts" x="556" y="569" text-anchor="middle" dominant-baseline="central">Dictation</text></g><g class="green"><rect x="60" y="620" width="12" height="12" rx="2"/></g><text class="ts" x="80" y="626" dominant-baseline="central">Runs on this device</text><g class="purple"><rect x="250" y="620" width="12" height="12" rx="2"/></g><text class="ts" x="270" y="626" dominant-baseline="central">Can use Meta, optional</text><g class="gray"><rect x="460" y="620" width="12" height="12" rx="2"/></g><text class="ts" x="480" y="626" dominant-baseline="central">Storage and limits</text></svg>
